# Reads spec/openapi.yaml, the PINNED copy, never a URL: a build has to be
# reproducible and work offline, and the diff has to show which spec version
# produced the client. Refresh with scripts/download-spec.sh.
package: api
output: internal/api/api_gen.go
generate:
  models: true
  client: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  # Database v2, IAM and OAuth, never v1. v1 is a separate, legacy vocabulary
  # on the same host: a different credential (`?apikey=<uuid>`), a hardcoded
  # customer list, and clients that do not follow redirects. Generating it would
  # put a second way to do everything into a library whose whole job is the
  # current one. IAM is generated and left unwrapped, as in the VPNDetection SDK;
  # only OAuth has a public accessor.
  include-operation-ids:
    - listDatabases
    - downloadDatabaseV2
    - databaseMetadataV2
    - databaseChecksumV2
    - listDownloads
    - accountIdentity
    - accountOrg
    - accountOrgMembers
    - accountListApikeys
    - accountCreateApikey
    - accountRotateApikey
    - accountRevokeApikey
    - accountRevealApikey
    - oauthMetadata
    - oauthDeviceAuthorization
    - oauthAuthorize
    - oauthToken
    - oauthRevoke
